name: Sync Instagram sample photos

on:
  workflow_dispatch:
  schedule:
    - cron: '47 */4 * * *'
  push:
    paths:
      - '.github/workflows/sync-instagram.yml'
      - 'scripts/sync_instagram.py'

permissions:
  contents: write

concurrency:
  group: instagram-photo-feed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website repository
        uses: actions/checkout@v4
      - name: Fetch current authorized Instagram photos
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python3 scripts/sync_instagram.py
      - name: Commit updated photo list
        shell: bash
        run: |
          if git diff --quiet -- instagram-posts.json; then
            echo "Instagram photo list unchanged or not configured."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram-posts.json
          git commit -m "Auto-update Instagram sample photos"
          git pull --rebase
          git push
