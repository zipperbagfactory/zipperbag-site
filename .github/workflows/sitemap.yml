name: Update sitemap automatically
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/generate_sitemap.py'
      - '.github/workflows/sitemap.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sitemap-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate sitemap from HTML pages
        run: python3 scripts/generate_sitemap.py
      - name: Commit only when sitemap changed
        run: |
          if ! git diff --quiet -- sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "Automatically update sitemap"
            git push
          fi
