name: Sync latest Naver blog posts

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'
  push:
    paths:
      - '.github/workflows/sync-naver-blog.yml'
      - 'scripts/sync_naver_blog.py'

permissions:
  contents: write

concurrency:
  group: naver-blog-feed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
      - name: Fetch the latest public blog posts
        run: python3 scripts/sync_naver_blog.py
      - name: Publish new blog data
        shell: bash
        run: |
          if git diff --quiet -- blog-posts.json; then
            echo "No changes to blog posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-posts.json
          git commit -m "Auto-update latest Naver blog posts"
          git push
